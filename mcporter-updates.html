<style>
/* Punctum 点阵显示字体（https://sundyme.github.io/punctum）+ JetBrains Mono */
@font-face {
  font-family: 'Punctum';
  src: url('assets/fonts/Punctum-VF.woff2') format('woff2'),
       url('https://cdn.jsdelivr.net/gh/sundyme/punctum@main/fonts/Punctum-VF.woff2') format('woff2');
  font-weight: 100 900;
  font-display: swap;
}
:root {
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-punctum: 'Punctum', 'JetBrains Mono', ui-monospace, monospace;
}
/* 显示位：品牌、首页主标题、打字机标语、产品卡标识、版本徽标、计时器 —— Punctum 点阵（字号加大、字重加深至 600 提升辨识度） */
.brand, .hero h1, .tagline, .pc-mark, .dc-count, .u-badge {
  font-family: 'Punctum', 'JetBrains Mono', ui-monospace, monospace !important;
  font-variation-settings: 'wght' 600, 'ROND' 100;
  letter-spacing: .06em;
}
.brand { transition: font-variation-settings 0.35s ease, text-shadow 0.3s ease; }
.brand:hover { font-variation-settings: 'wght' 700, 'ROND' 0 !important; text-shadow: 0 0 12px var(--accent-soft); }
.hero h1 { transition: font-variation-settings 0.4s ease, text-shadow 0.35s ease; }
.hero h1:hover { font-variation-settings: 'wght' 700, 'ROND' 0 !important; text-shadow: 0 0 16px var(--accent-soft); }
.product-card .pc-mark { transition: font-variation-settings 0.3s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease; }
.product-card:hover .pc-mark { font-variation-settings: 'wght' 700, 'ROND' 0 !important; transform: scale(1.08); background: var(--accent); color: var(--accent-text); box-shadow: 0 4px 14px var(--accent-soft); }
.dc-count:hover { font-variation-settings: 'wght' 700, 'ROND' 0 !important; text-shadow: 0 0 14px var(--accent-soft); }

/* 全站以 JetBrains Mono 为主字体，中文回退系统无衬线 */
body, button, input, select, textarea,
code, pre, kbd, samp,
.u-date, .u-meta,
.dc-date, .dc-label,
.pc-plat, .tag, .eyebrow,
.btn, .subnav a, .seg button,
.site-footer,
.out, .ok,
.field input, .field textarea, .field select {

}

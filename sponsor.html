/* Punctum 点阵显示字体（https://sundyme.github.io/punctum）+ JetBrains Mono */
@font-face {
  font-family: 'Punctum';
  src: url('https://cdn.jsdelivr.net/gh/sundyme/punctum@main/fonts/Punctum-VF.woff2') format('woff2');
  font-weight: 100 900;
  font-display: swap;
}
:root {
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

}
/* 显示位：品牌、打字机标语、产品卡标识 —— Punctum 点阵 */
.brand, .tagline, .pc-mark {
  font-family: var(--font-display) !important;
  font-variation-settings: 'wght' 500, 'ROND' 100;
  letter-spacing: .04em;
}
/* 等宽位：代码、更新日期/版本徽标、计时数字、编辑器输出 —— JetBrains Mono */
code, pre, kbd, samp,
.u-date, .u-badge, .u-meta,
.dc-count, .dc-date, .out, .ok {
  font-family: var(--font-mono) !important;

    <div class="sponsor-box">
      <img id="qrimg" width="280" alt="微信收款码">
      <script src="assets/qr-data.js"></script>
      <script>
      (function () {
  		var img = document.getElementById("qrimg");
 		var raw = atob(QR_IMG_B64);
		var bytes = new Uint8Array(raw.length);
		for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
		var blob = new Blob([bytes], { type: QR_IMG_MIME });
		img.src = URL.createObjectURL(blob);
	})();
	  </script>
